name: Bible test APK
on:
  push:
    branches: [build/bible-debug-ee65287]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build separate test installation
        working-directory: bible/android
        run: |
          sed -i 's/applicationId "kr.co.stargateedu.bible"/applicationId "kr.co.stargateedu.bible.test"/' app/build.gradle
          bash gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk BaroBible-295afd3-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify BaroBible-295afd3-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging BaroBible-295afd3-test.apk | grep -F "package: name='kr.co.stargateedu.bible.test'"
          unzip -p BaroBible-295afd3-test.apk assets/www/index.html | grep 'id="pick-book"'
      - uses: actions/upload-artifact@v4
        with:
          name: BaroBible-295afd3-test
          path: bible/android/BaroBible-295afd3-test.apk
          if-no-files-found: error
